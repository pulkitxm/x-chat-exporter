<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Chat Exporter</title>
<style>
:root { color-scheme: dark; }
body {
  margin: 0;
  background: #000;
  color: rgb(231, 233, 234);
  font-family: -apple-system, "system-ui", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
main { width: min(560px, 92vw); padding: 48px 0; }
h1 { font-size: 22px; margin: 0 0 6px; }
p.sub { color: rgb(113, 118, 123); margin: 0 0 28px; font-size: 14px; }
#steps { display: flex; flex-direction: column; gap: 10px; }
.step {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgb(22, 24, 28);
  border: 1px solid rgb(47, 51, 54);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
}
.step .dot { width: 10px; height: 10px; border-radius: 50%; background: rgb(62, 65, 68); flex: none; }
.step.active .dot { background: #1d9bf0; animation: pulse 1.2s infinite; }
.step.done .dot { background: #00ba7c; }
.step.error .dot { background: #f4212e; }
.step .detail { margin-left: auto; color: rgb(113, 118, 123); font-variant-numeric: tabular-nums; }
#bar { height: 6px; border-radius: 3px; background: rgb(47, 51, 54); margin: 24px 0 8px; overflow: hidden; }
#bar > div { height: 100%; width: 0%; background: #1d9bf0; transition: width .3s; }
#note { font-size: 13px; color: rgb(113, 118, 123); min-height: 20px; }
@keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
<main>
  <h1>X Chat Exporter</h1>
  <p class="sub">Keep the chat tab visible while the capture runs.</p>
  <div id="steps"></div>
  <div id="bar"><div></div></div>
  <div id="note"></div>
</main>
<script type="module" src="exporter.js"></script>
</body>
</html>
