name: Dead code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: No dead code anywhere
        run: bun run dead-code

      - name: No circular dependencies
        run: bun run cycles
