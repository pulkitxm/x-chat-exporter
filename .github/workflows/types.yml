name: Types

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run type-check
